# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - jobptit-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # --- PHẦN MỚI THÊM: TỰ ĐỘNG CẬP NHẬT DATABASE ---
      - name: Install dotnet ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Update Database
        # Đảm bảo đường dẫn job/job.csproj đúng với cấu trúc thư mục của bạn
        run: dotnet ef database update --project job/job.csproj --connection "${{ secrets.DB_CONNECTION }}"
      # ----------------------------------------------

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_922EAAD159134156B783CCA6EC9C5E4E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7E11DBEB99544386B388B70D69395E95 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BE64E8F170B9486F9F7135A551DD6507 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "jobptit-api"
          slot-name: "Production"
          package: .
